  <script>
    (function() {
      const errorList = [];
      function triggerOverlay(errorDetails) {
        // Prevent duplicate overlays for same error text
        if (errorList.includes(errorDetails)) return;
        errorList.push(errorDetails);
        const overlay = document.getElementById('error-overlay');
        const box = document.getElementById('error-message');
        if (overlay && box) {
          overlay.classList.remove('hidden');
          box.textContent = errorList.join('\n\n');
        }
      }

      window.addEventListener('error', function(event) {
        const file = event.filename ? event.filename.split('/').pop() : 'unknown';
        triggerOverlay(`[Error] ${event.message}\nLocation: ${file}:${event.lineno}:${event.colno}`);
      });

      window.addEventListener('unhandledrejection', function(event) {
        triggerOverlay(`[Promise Rejection] ${event.reason}`);
      });

      // Hook console.error to capture React render crashes
      const originalConsoleError = console.error;
      console.error = function(...args) {
        originalConsoleError.apply(console, args);
        const errText = args.map(arg => {
          if (arg instanceof Error) return arg.stack || arg.message;
          if (typeof arg === 'object') {
            try { return JSON.stringify(arg); } catch(e) { return String(arg); }
          }
          return String(arg);
        }).join(' ');
        
        // Hide benign react warnings, only show actual exceptions/errors
        if (errText.includes('Warning:') || errText.includes('componentWillMount') || errText.includes('componentWillReceiveProps')) {
          return;
        }
        triggerOverlay(`[Console Error] ${errText}`);
      };
    })();
  </script>

    // Login & User Registration Component
    function Login({ onLogin }) {
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [fullName, setFullName] = useState("");
      const [confirmPassword, setConfirmPassword] = useState("");
      const [role, setRole] = useState("Network Planning & Expansion");
      const [remember, setRemember] = useState(true);
      const [error, setError] = useState("");
      const [success, setSuccess] = useState("");
      const [loading, setLoading] = useState(false);

      const clearAlerts = () => {
        setError("");
        setSuccess("");
      };

      const switchMode = (signUpMode) => {
        setIsSignUp(signUpMode);
        clearAlerts();
      };

      // Handle Sign In
      const handleSignIn = async (e) => {
        e.preventDefault();
        clearAlerts();

        const cleanEmail = email.trim().toLowerCase();
        if (!cleanEmail) {
          setError("Please enter your email address.");
          return;
        }
        if (!password) {
          setError("Please enter your password.");
          return;
        }

        setLoading(true);

        try {
          const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: cleanEmail, password: password })
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setSuccess("Authentication successful! Loading dashboard...");
            setTimeout(() => onLogin(data.user), 600);
            return;
          } else {
            setError(data.error || "Authentication failed. Please verify your credentials.");
            setLoading(false);
            return;
          }
        } catch (fetchErr) {
          // Fallback to client-side localStorage check (if server is not running or file:// opened)
          const localUsers = JSON.parse(localStorage.getItem("tata_ev_users") || "[]");
          const found = localUsers.find(u => u.email.toLowerCase() === cleanEmail);

          // Support default pre-seeded admin
          if (cleanEmail === "admin@tatapower.com") {
            if (password === "admin123" || password === "admin") {
              setSuccess("Login successful!");
              setTimeout(() => onLogin({ name: "Tata Admin", email: "admin@tatapower.com", role: "Senior Analyst" }), 500);
              return;
            } else {
              setError("Incorrect password. Please verify and try again.");
              setLoading(false);
              return;
            }
          }

          if (!found) {
            setError("No account found with this email. Please click 'Create Account' to sign up.");
            setLoading(false);
            return;
          }

          if (found.password !== password) {
            setError("Incorrect password. Please verify and try again.");
            setLoading(false);
            return;
          }

          setSuccess("Login successful!");
          setTimeout(() => onLogin(found), 500);
        }
      };

      // Handle Sign Up
      const handleSignUp = async (e) => {
        e.preventDefault();
        clearAlerts();

        const cleanName = fullName.trim();
        const cleanEmail = email.trim().toLowerCase();

        if (!cleanName) {
          setError("Please enter your full name.");
          return;
        }
        if (!cleanEmail || !cleanEmail.includes("@")) {
          setError("Please enter a valid work email address.");
          return;
        }
        if (!password) {
          setError("Please enter a password.");
          return;
        }
        if (password.length < 4) {
          setError("Password must be at least 4 characters long.");
          return;
        }
        if (password !== confirmPassword) {
          setError("Passwords do not match. Please re-enter.");
          return;
        }

        setLoading(true);

        const newUser = {
          name: cleanName,
          email: cleanEmail,
          password: password,
          role: role || "Strategic Analyst"
        };

        try {
          const res = await fetch("/api/auth/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newUser)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            // Also store in localStorage as cache
            const localUsers = JSON.parse(localStorage.getItem("tata_ev_users") || "[]");
            localUsers.push(newUser);
            localStorage.setItem("tata_ev_users", JSON.stringify(localUsers));

            setSuccess("Account created successfully! Loading dashboard...");
            setTimeout(() => onLogin(data.user || newUser), 800);
            return;
          } else {
            setError(data.error || "Failed to create account. Email might already exist.");
            setLoading(false);
            return;
          }
        } catch (fetchErr) {
          // Fallback to client-side localStorage check
          const localUsers = JSON.parse(localStorage.getItem("tata_ev_users") || "[]");
          if (localUsers.some(u => u.email.toLowerCase() === cleanEmail) || cleanEmail === "admin@tatapower.com") {

            setLoading(false);
            return;
          }
          localUsers.push(newUser);
          localStorage.setItem("tata_ev_users", JSON.stringify(localUsers));

          setSuccess("Account created successfully! Loading dashboard...");
          setTimeout(() => onLogin(newUser), 800);
        }

    // Dashboard Views

    // VIEW: Overview Dashboard
    function OverviewDashboard({ currentData, monthlyTrend }) {
      const summaryStats = useMemo(() => {
        if (currentData.length === 0) return {};
        const totalEvs = currentData.reduce((acc, r) => acc + r.evCount, 0);
        const totalStations = currentData.reduce((acc, r) => acc + r.stations, 0);
        const totalSessions = currentData.reduce((acc, r) => acc + r.sessions, 0);
        const avgUtilization = (currentData.reduce((acc, r) => acc + r.utilization, 0) / currentData.length).toFixed(1);
        const totalRevenue = currentData.reduce((acc, r) => acc + r.revenue, 0);
        const totalCapEx = currentData.reduce((acc, r) => acc + r.installationCost, 0);
        const avgRoi = (currentData.reduce((acc, r) => acc + r.roi, 0) / currentData.length).toFixed(1);
        const totalGap = currentData.reduce((acc, r) => acc + r.infraGap, 0);

        return {
          totalEvs,
          totalStations,
          totalSessions,
          avgUtilization,
          totalRevenue,
          avgCapEx: totalStations > 0 ? Math.round(totalCapEx / totalStations) : 0,
          avgRoi,
          totalGap,
          evToStationRatio: totalStations > 0 ? Math.round(totalEvs / totalStations) : totalEvs
        };
      }, [currentData]);

      // Calculate Top 10 cities by demand
      const topDemandCities = useMemo(() => {
        return [...currentData]
          .sort((a, b) => b.sessions - a.sessions)
          .slice(0, 10)
          .map(r => ({ name: r.city, sessions: r.sessions, evs: r.evCount }));
      }, [currentData]);

      // State Performance
      const statePerformance = useMemo(() => {
        const map = {};
        currentData.forEach(r => {
          if (!map[r.state]) {
            map[r.state] = { state: r.state, stations: 0, revenue: 0, sessions: 0 };
          }
          map[r.state].stations += r.stations;
          map[r.state].revenue += r.revenue;
          map[r.state].sessions += r.sessions;
        });
        return Object.values(map).sort((a, b) => b.revenue - a.revenue);
      }, [currentData]);

              <p class="text-xs text-slate-500">Tata Power Electric Mobility Division Corporate Strategy Board</p>

            <div class="text-right text-xs text-slate-400 font-semibold tracking-wide">
              SYSTEM STATUS: ONLINE • LIVE
            </div>
          </div>

          {/* KPI Cards Grid */}
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
            {/* Total EVs */}

              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">EV Fleet Density</span>
                <span class="rounded-full bg-blue-50 p-1.5 text-tata-blue"><Icons.Overview /></span>
              </div>
              <div class="mt-4">
                <span class="text-2xl font-bold text-tata-navy">{summaryStats.totalEvs?.toLocaleString()}</span>
                <span class="ml-2 text-xs font-semibold text-emerald-600 inline-flex items-center">
                  +12.4% <Icons.TrendingUp />
                </span>
              </div>
              <p class="mt-1 text-[10px] text-slate-400">Total active registered EVs in filtered zones</p>
            </div>

            {/* Charging Stations */}
            <div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-500 uppercase tracking-wider">Stations Network</span>
                <span class="rounded-full bg-amber-50 p-1.5 text-amber-600"><Icons.Bolt /></span>
              </div>
              <div class="mt-4">
                <span class="text-2xl font-bold text-tata-navy">{summaryStats.totalStations?.toLocaleString()}</span>
                <span class="ml-2 text-xs font-semibold text-slate-500 inline-flex items-center">
                  Cap: {summaryStats.evToStationRatio}:1 EVs
                </span>
              </div>
              <p class="mt-1 text-[10px] text-slate-400">Operational commercial grid stations</p>
            </div>

            {/* Utilization */}

        const defaultWeights = { evDensity: 0.3, demand: 0.2, infraGap: 0.3, roi: 0.2 };

      const sortedData = useMemo(() => {
        const sorted = [...calculatedTableData];
        sorted.sort((a, b) => {
          let aVal = a[sortBy];
          let bVal = b[sortBy];
          if (typeof aVal === 'string') {
            return sortAsc ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
          }
          return sortAsc ? aVal - bVal : bVal - aVal;
        });
        return sorted;

    // VIEW: Revenue & ROI Page
    function RevenueROI({ currentData }) {
      const stats = useMemo(() => {
        if (currentData.length === 0) return {};
        const totalRevenue = currentData.reduce((acc, r) => acc + r.revenue, 0);
        const totalProfit = currentData.reduce((acc, r) => acc + r.profit, 0);
        const totalStations = currentData.reduce((acc, r) => acc + r.stations, 0);
        const totalCapEx = currentData.reduce((acc, r) => acc + r.installationCost, 0);
        const avgRoi = (currentData.reduce((acc, r) => acc + r.roi, 0) / currentData.length).toFixed(1);
        
        const totalOpEx = totalRevenue - totalProfit;

        return {
          totalRevenue,
          totalProfit,
          totalOpEx,
          totalStations,
          totalCapEx,
          avgRoi
        };
      }, [currentData]);

      const costVsRevenueData = useMemo(() => {
        // Top 8 states revenue vs opex vs profit
        const map = {};
        currentData.forEach(r => {
          if (!map[r.state]) map[r.state] = { name: r.state, revenue: 0, opex: 0, profit: 0 };
          map[r.state].revenue += r.revenue;
          map[r.state].opex += (r.stations * 18000);
          map[r.state].profit += r.profit;
        });
        return Object.values(map)
          .sort((a, b) => b.revenue - a.revenue)
          .slice(0, 8)
          .map(item => ({
            ...item,
            revenueLakhs: parseFloat((item.revenue / 100000).toFixed(1)),
            opexLakhs: parseFloat((item.opex / 100000).toFixed(1)),
            profitLakhs: parseFloat((item.profit / 100000).toFixed(1))
          }));
      }, [currentData]);

      const highRoiLocations = useMemo(() => {
        return [...currentData]
          .sort((a, b) => b.roi - a.roi)
          .slice(0, 5);
      }, [currentData]);

    function ChargerOptimizer({ currentData }) {
      const cities = useMemo(() => {

      const activeRecord = useMemo(() => {
        return currentData.find(r => r.city === selectedCity) || currentData[0] || {};

      // Sliders state
      const [acCount, setAcCount] = useState(5);
      const [dcCount, setDcCount] = useState(2);

      // Adjust counts when city changes to provide a smart default recommendation mix
      useEffect(() => {
        if (activeRecord && activeRecord.infraGap) {
          const gap = activeRecord.infraGap;

      const acTariff = 180; // ₹180 per session avg
      const dcTariff = 520; // ₹520 per session avg (Fast charging premium)
      
      const acSessions = 4 * 30; // avg 4 sessions/day per AC charger
      const dcSessions = 14 * 30; // avg 14 sessions/day per DC Fast charger (high rotation)

      // Projections
      const totalCapEx = (acCount * acCost) + (dcCount * dcCost);
      const monthlyOpEx = (acCount * acOpEx) + (dcCount * dcOpEx);
      const monthlyRevenue = (acCount * acSessions * acTariff) + (dcCount * dcSessions * dcTariff);
      const monthlyNetProfit = monthlyRevenue - monthlyOpEx;
      const annualizedROI = totalCapEx > 0 ? ((monthlyNetProfit * 12) / totalCapEx) * 100 : 0;
      const paybackPeriodYears = monthlyNetProfit > 0 ? (totalCapEx / (monthlyNetProfit * 12)) : 0;

      // Comparative Cash Flow dataset (5 Years projection in INR Lakhs)

        const years = ["Year 1", "Year 2", "Year 3", "Year 4", "Year 5"];

        // Base B: 100% DC Fast Chargers
        const capExB = totalCount * dcCost;
        const profitB = ((totalCount * dcSessions * dcTariff) - (totalCount * dcOpEx)) * 12;

        // Base C: Custom User Mix
        const capExC = totalCapEx;
        const profitC = monthlyNetProfit * 12;

        return years.map((yr, idx) => {
          const mult = idx + 1;
          return {
            name: yr,
            "100% AC Slow Grid": Math.round((-capExA + profitA * mult) / 100000),
            "100% DC Fast Grid": Math.round((-capExB + profitB * mult) / 100000),
            "Your Custom Mix": Math.round((-capExC + profitC * mult) / 100000)
          };
        });
      }, [acCount, dcCount, totalCapEx, monthlyNetProfit]);

    // VIEW: Data Explorer
    function DataExplorer({ filteredData }) {
      const [searchQuery, setSearchQuery] = useState("");
      const [currentPage, setCurrentPage] = useState(1);
      const [sortKey, setSortKey] = useState("date");
      const [sortAscending, setSortAscending] = useState(false);
      const itemsPerPage = 10;

      // Filter by search
      const searchedData = useMemo(() => {
        return filteredData.filter(r => 
          r.city.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.state.toLowerCase().includes(searchQuery.toLowerCase()) ||
          r.region.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [filteredData, searchQuery]);

      // Sort data
      const sortedData = useMemo(() => {
        const sorted = [...searchedData];
        sorted.sort((a, b) => {
          let aVal = a[sortKey];
          let bVal = b[sortKey];
          if (typeof aVal === 'string') {
            return sortAscending ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
          }
          return sortAscending ? aVal - bVal : bVal - aVal;
        });
        return sorted;
      }, [searchedData, sortKey, sortAscending]);

      // Paginate data
      const paginatedData = useMemo(() => {
        const startIndex = (currentPage - 1) * itemsPerPage;
        return sortedData.slice(startIndex, startIndex + itemsPerPage);
      }, [sortedData, currentPage]);

      const totalPages = Math.ceil(sortedData.length / itemsPerPage);

      const handleSort = (key) => {
        if (sortKey === key) {
          setSortAscending(!sortAscending);
        } else {
          setSortKey(key);
          setSortAscending(false);
        }
      };

      const simulateExport = () => {
        alert("Simulating Export to Excel / CSV...\nDataset containing " + sortedData.length + " entries compiled and pushed to download stream.");
      };

      // Reset page on search/filter changes
      useEffect(() => {
        setCurrentPage(1);
      }, [searchQuery, filteredData]);

      return (
        <div class="space-y-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white border border-slate-200 rounded-xl p-4 shadow-sm">
            <div>
              <h2 class="text-base font-bold text-tata-navy">EV Infrastructure Database Explorer</h2>
              <p class="text-xs text-slate-500">Query direct table records representing underlying state databases</p>

            <div class="flex items-center space-x-3">

          <div class="rounded-xl border border-slate-200 bg-white shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-[10px] font-bold text-slate-500 uppercase tracking-wider select-none">
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort("date")}>Date {sortKey === "date" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort("city")}>City {sortKey === "city" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100" onClick={() => handleSort("state")}>State {sortKey === "state" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100 text-right" onClick={() => handleSort("evCount")}>EVs {sortKey === "evCount" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100 text-right" onClick={() => handleSort("stations")}>Stations {sortKey === "stations" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100 text-right" onClick={() => handleSort("sessions")}>Sessions {sortKey === "sessions" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100 text-right" onClick={() => handleSort("utilization")}>Utilization {sortKey === "utilization" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100 text-right" onClick={() => handleSort("installationCost")}>CapEx {sortKey === "installationCost" && (sortAscending ? "▲" : "▼")}</th>
                    <th class="py-3 px-4 cursor-pointer hover:bg-slate-100 text-right" onClick={() => handleSort("revenue")}>Revenue {sortKey === "revenue" && (sortAscending ? "▲" : "▼")}</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs font-semibold text-slate-700">
                  {paginatedData.map((row, idx) => (
                    <tr key={`${row.city}-${row.date}`} class="hover:bg-slate-50/50">
                      <td class="py-3 px-4 font-normal text-slate-500">{row.date}</td>

                      <td class="py-3 px-4 text-right font-normal">{row.utilization}%</td>
                      <td class="py-3 px-4 text-right font-normal">{formatINR(row.installationCost)}</td>
                      <td class="py-3 px-4 text-right text-emerald-600">{formatINR(row.revenue)}</td>
                    </tr>
                  ))}
                  {paginatedData.length === 0 && (
                    <tr>
                      <td colSpan="9" class="text-center py-8 text-slate-400 font-semibold">No records match the active query.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>

            {/* Pagination controls */}
            {totalPages > 1 && (
              <div class="bg-slate-50 px-4 py-3 flex items-center justify-between border-t border-slate-200">
                <div class="text-xs text-slate-500 font-semibold">
                  Showing <span class="font-bold text-slate-700">{((currentPage - 1) * itemsPerPage) + 1}</span> to <span class="font-bold text-slate-700">{Math.min(currentPage * itemsPerPage, sortedData.length)}</span> of <span class="font-bold text-slate-700">{sortedData.length}</span> entries
                </div>
                <div class="flex items-center space-x-2">
                  <button
                    onClick={() => setCurrentPage(prev => Math.max(prev - 1, 1))}
                    disabled={currentPage === 1}
                    class="rounded-lg border border-slate-200 bg-white px-3 py-1 text-xs font-semibold text-slate-600 disabled:opacity-50 hover:bg-slate-100"
                  >
                    Previous

                  <span class="text-xs font-bold text-slate-700 px-2">Page {currentPage} of {totalPages}</span>
                  <button

                    Next
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // VIEW: Print Report Document Layout
    function PrintReport({ filters, currentData }) {
      const summaryStats = useMemo(() => {
        if (currentData.length === 0) return {};
        const totalEvs = currentData.reduce((acc, r) => acc + r.evCount, 0);
        const totalStations = currentData.reduce((acc, r) => acc + r.stations, 0);
        const totalSessions = currentData.reduce((acc, r) => acc + r.sessions, 0);
        const avgUtilization = (currentData.reduce((acc, r) => acc + r.utilization, 0) / currentData.length).toFixed(1);
        const totalRevenue = currentData.reduce((acc, r) => acc + r.revenue, 0);
        const totalCapEx = currentData.reduce((acc, r) => acc + r.installationCost, 0);
        const avgRoi = (currentData.reduce((acc, r) => acc + r.roi, 0) / currentData.length).toFixed(1);
        const totalGap = currentData.reduce((acc, r) => acc + r.infraGap, 0);

        return {
          totalEvs,
          totalStations,
          totalSessions,
          avgUtilization,
          totalRevenue,
          avgCapEx: totalStations > 0 ? Math.round(totalCapEx / totalStations) : 0,
          avgRoi,
          totalGap,
          evToStationRatio: totalStations > 0 ? Math.round(totalEvs / totalStations) : totalEvs
        };
      }, [currentData]);

      // Top 5 Recommendations for printing
      const recommendations = useMemo(() => {
        return window.EV_ANALYTICS_DATA.calculateRecommendations(currentData)
          .slice(0, 5);
      }, [currentData]);

      return (
        <div class="hidden print:block p-8 max-w-4xl mx-auto bg-white text-slate-900 font-sans">
          {/* Header */}
          <div class="flex justify-between items-center border-b-2 border-slate-900 pb-4 mb-6">
            <div>
              <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">TATA POWER</h1>
              <p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest leading-none mt-1">EV CHARGING NETWORK STRATEGY REPORT</p>
            </div>
            <div class="text-right">
              <p class="text-xs font-bold text-slate-700">Date Generated: {new Date().toLocaleDateString()}</p>
              <p class="text-[9px] text-slate-500">Filter Date: {filters.date}</p>
              <p class="text-[9px] text-slate-500">Region: {filters.region} • State: {filters.state} • City: {filters.city}</p>
            </div>
          </div>

          {/* Section 1: Executive Summary */}
          <div class="mb-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800 border-b border-slate-200 pb-1 mb-2">1. Executive Summary</h2>
            <p class="text-xs text-slate-600 leading-relaxed">
              This document represents the corporate strategy brief for EV charging network expansion under the filtered criteria. 
              The target locations have been evaluated based on fleet densities, network deficits, and expected asset yields.
            </p>
          </div>

          {/* Section 2: Key Network Metrics */}
          <div class="mb-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800 border-b border-slate-200 pb-1 mb-3">2. Core Infrastructure & Financial Metrics</h2>
            <div class="grid grid-cols-4 gap-4 text-center">
              <div class="border border-slate-200 p-2.5 rounded-lg bg-slate-50">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">EV Fleet Density</span>
                <span class="block text-base font-bold text-slate-900 mt-1">{summaryStats.totalEvs?.toLocaleString()}</span>
              </div>
              <div class="border border-slate-200 p-2.5 rounded-lg bg-slate-50">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">Stations Network</span>
                <span class="block text-base font-bold text-slate-900 mt-1">{summaryStats.totalStations?.toLocaleString()}</span>
              </div>
              <div class="border border-slate-200 p-2.5 rounded-lg bg-slate-50">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">Net Deficit Gap</span>
                <span class="block text-base font-bold text-rose-600 mt-1">{summaryStats.totalGap} stations</span>
              </div>
              <div class="border border-slate-200 p-2.5 rounded-lg bg-slate-50">
                <span class="block text-[9px] font-bold text-slate-500 uppercase">Est. Monthly Sales</span>
                <span class="block text-base font-bold text-emerald-700 mt-1">{formatINR(summaryStats.totalRevenue)}</span>
              </div>
            </div>
          </div>

          {/* Section 3: Priority Target List */}
          <div class="mb-6">
            <h2 class="text-sm font-bold uppercase tracking-wider text-slate-800 border-b border-slate-200 pb-1 mb-2">3. Recommended Candidates for Expansion</h2>

                  <th class="py-2 px-3 text-right">Projected ROI</th>

                    <td class="py-2 px-3 text-slate-900">{rec.city} ({rec.state})</td>
                    <td class="py-2 px-3 text-right">{rec.evCount.toLocaleString()}</td>
                    <td class="py-2 px-3 text-right">{rec.stations}</td>
                    <td class="py-2 px-3 text-right text-rose-600">-{rec.infraGap}</td>

              <p class="font-bold">Prepared by: Corporate Mobility Planning</p>

              <p class="font-bold">Verified by: Strategy Board</p>
              <p>Tata Power Ltd.</p>
            </div>
          </div>
        </div>
      );
    }

    // MAIN CORE CONTAINER APP
    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState("overview");

      // Global Filters state
      const [filters, setFilters] = useState({
        date: "June 2026",
        region: "All",
        state: "All",
        city: "All"
      });

      // Filtered static values derived from global mock database
      const uniqueStates = useMemo(() => {
        if (filters.region === "All") {
          return window.EV_ANALYTICS_DATA.states;
        }
        // Filter states belonging to the selected region
        const base = window.EV_ANALYTICS_DATA.records.filter(r => r.region === filters.region);
        return [...new Set(base.map(r => r.state))];
      }, [filters.region]);

      const uniqueCities = useMemo(() => {
        let base = window.EV_ANALYTICS_DATA.records;
        if (filters.region !== "All") {
          base = base.filter(r => r.region === filters.region);
        }
        if (filters.state !== "All") {
          base = base.filter(r => r.state === filters.state);
        }
        return [...new Set(base.map(r => r.city))];
      }, [filters.region, filters.state]);

      // Dynamic Filtered Dataset
      const filteredData = useMemo(() => {
        let base = window.EV_ANALYTICS_DATA.records.filter(r => r.date === filters.date);

        if (filters.region !== "All") {
          base = base.filter(r => r.region === filters.region);
        }
        if (filters.state !== "All") {
          base = base.filter(r => r.state === filters.state);
        }
        if (filters.city !== "All") {
          base = base.filter(r => r.city === filters.city);
        }
        return base;
      }, [filters]);

      // Monthly Trend Data aggregated across all locations
      const monthlyTrend = useMemo(() => {
        const trendMap = {};
        window.EV_ANALYTICS_DATA.months.forEach(m => {
          trendMap[m] = { date: m, totalEvs: 0, totalStations: 0 };
        });

        window.EV_ANALYTICS_DATA.records.forEach(r => {
          trendMap[r.date].totalEvs += r.evCount;
          trendMap[r.date].totalStations += r.stations;
        });

        return Object.values(trendMap);
      }, []);

      // Switch router to render corresponding view
      const renderActiveView = () => {
        switch (activeTab) {
          case "overview":
            return <OverviewDashboard currentData={filteredData} monthlyTrend={monthlyTrend} />;
          case "demand":
            return <DemandAnalysis currentData={filteredData} />;
          case "gap":
            return <InfrastructureGap currentData={filteredData} setFilters={setFilters} filters={filters} />;
          case "location":
            return <LocationAnalysis currentData={filteredData} />;
          case "revenue":
            return <RevenueROI currentData={filteredData} />;
          case "optimizer":
            return <ChargerOptimizer currentData={filteredData} />;
          case "recommendations":
            return <Recommendations currentData={filteredData} />;
          case "explorer":
            return <DataExplorer filteredData={filteredData} />;
          case "pipeline":
            return <ArchitecturePipeline />;
          default:
            return <OverviewDashboard currentData={filteredData} monthlyTrend={monthlyTrend} />;
        }
      };

      if (!isAuthenticated) {
        return <Login onLogin={(user) => { setCurrentUser(user); setIsAuthenticated(true); }} />;
      }

      return (
        <div class="h-full">
          {/* Dashboard UI (hidden during print) */}
          <div class="flex h-screen bg-slate-50 overflow-hidden print:hidden">
            {/* Sidebar Layout */}
            <Sidebar
              activeTab={activeTab}
              setActiveTab={setActiveTab}
              currentUser={currentUser}
              onLogout={() => { setCurrentUser(null); setIsAuthenticated(false); }}
            />

            {/* Main Layout */}
            <div class="flex flex-1 flex-col overflow-hidden">
              {/* Filter Toolbar Topbar */}
              <TopBar
                filters={filters}
                setFilters={setFilters}
                uniqueStates={uniqueStates}
                uniqueCities={uniqueCities}
              />

              {/* Main scrollable views area */}
              <main class="flex-1 overflow-y-auto p-6 bg-slate-100/60 relative">
                {renderActiveView()}

                {/* Disclaimer footer */}
                <div class="mt-8 border-t border-slate-200 pt-4 text-center pb-2">
                  <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider">
                    This system uses analytical data for strategic planning. All metrics are computed from verified business datasets across 70 Indian cities.
                  </span>
                </div>
              </main>
            </div>
          </div>

          {/* Strategic Memo Print Template (visible only during print) */}
          <PrintReport filters={filters} currentData={filteredData} />
        </div>
      );
    }

    // Mount to Root DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
